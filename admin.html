<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — SML Foods</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.svg?v=7" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png?v=7" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=7">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Ramabhadra&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=7">
  <link rel="stylesheet" href="assets/css/admin.css?v=7">
</head>
<body class="admin">
  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="assets/img/favicon.svg?v=7" width="56" height="56" alt="">
      <h1>SML Admin</h1>
      <p class="muted">Sign in to manage products and orders</p>
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <p class="err" id="lErr"></p>
      <button class="btn btn-primary btn-lg btn-block" id="lBtn">Sign in</button>
      <button type="button" class="link" id="lForgot">Forgot password?</button>
    </form>
  </section>

  <!-- Not an admin -->
  <section class="login" id="denied" hidden>
    <div class="login-card">
      <h1>Almost there</h1>
      <p>You're signed in as <b id="dEmail"></b>, but this account is not an admin yet.</p>
      <p class="muted" style="font-size:14px">In Firebase Console → Firestore → create collection <code>admins</code> → add a document with this ID:</p>
      <p><code class="uid" id="dUid"></code></p>
      <button class="btn btn-ghost btn-block" id="dRetry">I've added it — check again</button>
      <button class="btn btn-ghost btn-block" data-logout style="margin-top:8px">Sign out</button>
    </div>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a class="side-logo" href="index.html" target="_blank" rel="noopener" title="Open shop">
        <img src="assets/img/favicon.svg?v=7" width="34" height="34" alt=""><span><b>SML</b> Admin</span>
      </a>
      <nav class="side-nav" id="sideNav">
        <button data-view="overview">Overview</button>
        <button data-view="orders">Orders <span class="count" id="navPending" hidden></span></button>
        <button data-view="products">Products</button>
        <button data-view="categories">Categories</button>
        <button data-view="reviews">Reviews</button>
        <button data-view="settings">Settings</button>
      </nav>
      <div class="side-foot">
        <span class="muted" id="who"></span>
        <button class="btn btn-ghost" data-logout>Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="top-actions">
          <span class="store-state" id="storeState"></span>
          <a class="btn btn-ghost" href="index.html" target="_blank" rel="noopener">View shop ↗</a>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="modal" id="aModal" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop" data-mclose></div>
    <div class="modal-card admin-modal" id="aModalBody"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
  <script src="assets/js/config.js?v=7"></script>
  <script src="assets/js/catalog.js?v=7"></script>
  <script src="assets/js/common.js?v=7"></script>
  <script src="assets/js/admin.js?v=7"></script>
</body>
</html>
